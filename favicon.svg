<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1627"/>
      <stop offset="100%" stop-color="#040C1A"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg4)"/>
  <circle cx="512" cy="512" r="400" fill="url(#glow4)"/>
  <!-- Hexagon ring -->
  <polygon points="512,260 690,365 690,575 512,680 334,575 334,365" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" opacity="0.95"/>
  <!-- Inner bond lines -->
  <line x1="512" y1="260" x2="512" y2="180" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="690" y1="575" x2="760" y2="618" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <line x1="334" y1="575" x2="264" y2="618" stroke="#60A5FA" stroke-width="14" stroke-linecap="round"/>
  <!-- Vertex dots -->
  <circle cx="512" cy="260" r="28" fill="#FFFFFF"/>
  <circle cx="690" cy="365" r="22" fill="#FFFFFF"/>
  <circle cx="690" cy="575" r="28" fill="#60A5FA"/>
  <circle cx="512" cy="680" r="22" fill="#FFFFFF"/>
  <circle cx="334" cy="575" r="28" fill="#60A5FA"/>
  <circle cx="334" cy="365" r="22" fill="#FFFFFF"/>
  <circle cx="512" cy="180" r="18" fill="#FFFFFF"/>
  <circle cx="760" cy="618" r="18" fill="#60A5FA"/>
  <circle cx="264" cy="618" r="18" fill="#60A5FA"/>
</svg>
